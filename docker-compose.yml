services:
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: collectibles_timescale
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: safe_local_password
      POSTGRES_DB: collectibles_prod
    ports:
      - "5432:5432"
    volumes:
      - timescale_data:/var/lib/postgresql/data
      - ./scripts/init_timescale.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2048M

  redis:
    image: redis:7-alpine
    container_name: collectibles_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: collectibles_app
    depends_on:
      timescaledb:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      ENVIRONMENT: production
      DRY_RUN: "true"
      DATABASE_URL: postgresql+asyncpg://postgres:safe_local_password@timescaledb:5432/collectibles_prod
      REDIS_URL: redis://redis:6379/0
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1024M

volumes:
  timescale_data:
  redis_data:
